<!DOCTYPE html> 
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX SYSTEM PORTAL</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #fff;
    margin: 0;
    display: flex;
    justify-content: center;
}

.wrapper {
    width: 100%;
    max-width: 900px;
}

/* Header */
header {
    background: #111821;
    padding: 20px;
    text-align: center;
    font-size: 28px;
}

/* Statusrad */
.status {
    text-align: center;
    padding: 8px;
    background: #16202a;
    font-size: 14px;
    color: #9ecfff;
}

/* Välkomsttext */
#welcome {
    text-align: center;
    font-size: 22px;
    margin-top: 15px;
    color: #9ecfff;
}

/* Tid */
.timebar {
    display: flex;
    justify-content: center;
    gap: 40px;
    background: #16202a;
    padding: 15px;
    font-size: 18px;
    flex-wrap: wrap;
}

/* Knappar */
.container {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 60px 20px;
    flex-wrap: wrap;
}

.button {
    padding: 30px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    min-width: 220px;
}

.academy { background: #1e90ff; }
.os { background: #28a745; }
.test { background: #ff9800; }
.ai { background: #9c27b0; }

.button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

/* Footer */
footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #666;
}

/* Mobil */
@media (max-width: 600px) {
    .container {
        gap: 15px;
        padding: 30px 10px;
    }

    .button {
        width: 100%;
        max-width: 320px;
        padding: 20px;
    }

    .timebar {
        flex-direction: column;
        gap: 10px;
    }
}
</style>

</head>

<body>

<div class="wrapper">

<header>
DX SYSTEM PORTAL
</header>

<div class="status" id="statusBar">
🔍 Laddar systemstatus...
</div>

<div id="welcome"></div>

<div class="timebar">
    <div id="date"></div>
    <div id="localTime"></div>
    <div id="utcTime"></div>
</div>

<div class="container">

    <button class="button academy" onclick="goAcademy()">
        🎓 DX Academy<br><small>Lär dig DX</small>
    </button>

    <button class="button os" onclick="goDXOS()">
        📡 DX-OS<br><small>Operativt system</small>
    </button>

    <button class="button test" onclick="goTest()">
        🧪 Testmiljö<br><small>Utveckling</small>
    </button>

    <button class="button ai" onclick="openAI()">
        🤖 AI Assistent<br><small>Analysera signaler</small>
    </button>

</div>

<footer>
DX SYSTEM v1.0 | Global Radio Intelligence Platform
</footer>

</div>

<script>

// ===== NAVIGATION =====
function goAcademy() {
    window.location.href = "https://1kuli1.github.io/DX-Academy/academy-start1.html";
}

function goDXOS() {
    window.location.href = "https://1kuli1.github.io/dx-os/";
}

function goTest() {
    window.location.href = "https://1kuli1.github.io/test/";
}

function openAI() {
    window.open("https://chat.openai.com", "_blank");
}

// ===== TID =====
const locale = navigator.language;

function updateTime() {
    const now = new Date();

    document.getElementById("date").innerText =
        now.toLocaleDateString(locale, {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

    document.getElementById("localTime").innerText =
        "Lokal: " + now.toLocaleTimeString(locale);

    document.getElementById("utcTime").innerText =
        "UTC: " + now.toUTCString().split(" ")[4];
}

// ===== VÄLKOMST =====
function updateWelcome() {
    const hour = new Date().getHours();
    let greeting = "";

    if (hour < 10) greeting = "God morgon";
    else if (hour < 17) greeting = "God dag";
    else greeting = "God kväll";

    document.getElementById("welcome").innerText =
        greeting + " – DX SYSTEM är redo";
}

// ===== STATUS (smart feature 🔥) =====
function detectSystem() {
    const url = window.location.href;

    let system = "DX SYSTEM";

    if (url.includes("dx-os")) system = "📡 DX-OS aktivt";
    if (url.includes("DX-Academy")) system = "🎓 DX Academy aktivt";
    if (url.includes("test")) system = "🧪 Testmiljö aktiv";

    document.getElementById("statusBar").innerText = system;
}

// Init
updateTime();
updateWelcome();
detectSystem();
setInterval(updateTime, 1000);

</script>

</body>
</html>
